<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Streak Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ===== DESIGN TOKENS ===== */
:root {
  --bg: #0c0a14; --surface: #151221; --card: #1e1a2e;
  --card-border: rgba(139,92,246,0.08); --card-hover: #262040;
  --text: #e8e4f0; --text-secondary: #9088a8; --text-muted: #5c5478;
  --accent: #8b5cf6; --accent-dim: rgba(139,92,246,0.12);
  --accent-glow: rgba(139,92,246,0.25);
  --gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
  --green: #22c55e; --green-dim: rgba(34,197,94,0.12);
  --blue: #3b82f6; --blue-dim: rgba(59,130,246,0.12);
  --amber: #f59e0b; --amber-dim: rgba(245,158,11,0.12);
  --red: #ef4444; --red-dim: rgba(239,68,68,0.12);
  --purple: #a855f7; --purple-dim: rgba(168,85,247,0.12);
  --radius: 14px; --radius-sm: 10px; --radius-pill: 999px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f3fa; --surface: #ffffff; --card: #ffffff;
    --card-border: rgba(139,92,246,0.1); --card-hover: #f8f6fc;
    --text: #1a1530; --text-secondary: #6b6280; --text-muted: #9a93af;
    --accent-dim: rgba(139,92,246,0.08); --accent-glow: rgba(139,92,246,0.15);
    --green-dim: rgba(34,197,94,0.08); --blue-dim: rgba(59,130,246,0.08);
    --amber-dim: rgba(245,158,11,0.08); --red-dim: rgba(239,68,68,0.08);
    --purple-dim: rgba(168,85,247,0.08);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f3fa; --surface: #ffffff; --card: #ffffff;
  --card-border: rgba(139,92,246,0.1); --card-hover: #f8f6fc;
  --text: #1a1530; --text-secondary: #6b6280; --text-muted: #9a93af;
  --accent-dim: rgba(139,92,246,0.08); --accent-glow: rgba(139,92,246,0.15);
  --green-dim: rgba(34,197,94,0.08); --blue-dim: rgba(59,130,246,0.08);
  --amber-dim: rgba(245,158,11,0.08); --red-dim: rgba(239,68,68,0.08);
  --purple-dim: rgba(168,85,247,0.08);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
</style>
</head>
<body>
</body>
</html>
